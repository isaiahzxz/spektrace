services:
  postgres:
    image: postgres:16-alpine
    container_name: spektrace-postgres
    environment:
      POSTGRES_USER: spektrace
      POSTGRES_PASSWORD: spektrace_local_dev
      POSTGRES_DB: spektrace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spektrace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spektrace -d spektrace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: spektrace-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - spektrace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spektrace_pg_data:
  spektrace_redis_data:
